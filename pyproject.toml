[tool.poetry]
name = "wavekit-mcp"
version = "0.5.0"
description = "MCP server for AI-driven waveform analysis via wavekit"
authors = ["cxzzzz <cxz19961010@outlook.com>"]
readme = "README.md"
repository = "https://github.com/cxzzzz/wavekit-mcp"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
tomli = ">=2.0"
fastmcp = ">=2.0"
wavekit = ">=0.7.0"
pyvcd = ">=0.4.0"
numpy = "*"
RestrictedPython = ">=7.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[tool.poetry.scripts]
wavekit-mcp = "wavekit_mcp.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as requiring Surfer binary",
]
